<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232a3b"/>
      <stop offset="1" stop-color="#0c0f16"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#7aa2f7" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="main" gradientUnits="userSpaceOnUse" x1="0" y1="280" x2="0" y2="790">
      <stop offset="0" stop-color="#9ab8ff"/>
      <stop offset="1" stop-color="#5f86e8"/>
    </linearGradient>
    <linearGradient id="branch" gradientUnits="userSpaceOnUse" x1="0" y1="320" x2="0" y2="700">
      <stop offset="0" stop-color="#cdb2ff"/>
      <stop offset="1" stop-color="#a183f0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- macOS-style squircle tile (824pt grid inside the 1024 canvas) -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="url(#rim)" stroke-width="3"/>

  <!-- Commit graph: a main line, a branch that forks off and merges back, HEAD on top -->
  <g fill="none" stroke-linecap="round" stroke-width="46">
    <path d="M412 690 C412 600 612 616 612 528 L612 470 C612 386 412 400 412 318" stroke="url(#branch)"/>
    <path d="M412 300 L412 770" stroke="url(#main)"/>
  </g>
  <!-- commits -->
  <circle cx="412" cy="744" r="46" fill="#7aa2f7"/>
  <circle cx="612" cy="500" r="46" fill="#bb9af7"/>
  <!-- HEAD: ring with a warm core -->
  <circle cx="412" cy="276" r="64" fill="#0f131c"/>
  <circle cx="412" cy="276" r="64" fill="none" stroke="#ff9e64" stroke-width="28"/>
  <circle cx="412" cy="276" r="22" fill="#ff9e64"/>
</svg>
