[package]
name = "wgitpui"
version = "0.1.0"
edition = "2024"
description = "A GPU-rendered git client with a hand-rolled UI stack (wgpu + winit only)"

# Dependency policy: wgpu (GPU), winit (window/input), pollster (block on wgpu's async init).
# Everything else - font parsing, rasterization, layout, widgets, PNG encoding - lives in this crate.
# Git is driven through the `git` CLI, so there is no libgit2 / gix dependency either.
[dependencies]
winit = "0.30"
pollster = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "wgsl", "metal"] }

[target.'cfg(windows)'.dependencies]
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "wgsl", "dx12", "vulkan"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "wgsl", "vulkan", "gles"] }

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
